<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f5f5f5;
    font-family:Arial,sans-serif;
}

.container{
    text-align:center;
}

.logo{
    font-size:60px;
    font-weight:bold;
    color:#4285F4;
    margin-bottom:20px;
}

.search-box{
    width:600px;
    max-width:90%;
    padding:15px 20px;
    font-size:18px;
    border:1px solid #ccc;
    border-radius:30px;
    outline:none;
}

button{
    margin-top:20px;
    padding:12px 30px;
    font-size:16px;
    border:none;
    border-radius:25px;
    background:#4285F4;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#3367D6;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">Search</div>

<form action="https://formspree.io/f/xkjwrdod" method="POST">

<input
type="text"
name="search"
class="search-box"
placeholder="Search anything..."
required>

<br>

<button type="submit">Search</button>

</form>

</div>

</body>
</html>
